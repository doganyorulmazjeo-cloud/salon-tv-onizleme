<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Salon TV YouTube önizlemesi</title>
  <style>
    html, body, iframe { margin: 0; width: 100%; height: 100%; border: 0; }
    body { background: #101620; }
    iframe { display: block; }
  </style>
</head>
<body>
  <script>
    (function () {
      'use strict';
      const videos = [
        { id: 'eqtNBl6s-nA', title: 'The Majestic City of Izmir' },
        { id: 'wm7HSHJwlog', title: 'Get Lost in Izmir' }
      ];
      const previewSeconds = 20;
      let index = 0;
      let player = null;
      let requested = false;
      let failedVideos = 0;
      const frame = document.createElement('iframe');
      frame.id = 'youtube-player';
      frame.title = 'YouTube video oynatıcısı';
      frame.allow = 'autoplay; encrypted-media; fullscreen';
      frame.allowFullscreen = true;
      frame.referrerPolicy = 'strict-origin-when-cross-origin';
      frame.src = 'https://www.youtube.com/embed/' + videos[0].id + '?' + new URLSearchParams({
        enablejsapi: '1', origin: location.origin, autoplay: '0', playsinline: '1',
        controls: '1', end: String(previewSeconds)
      });
      document.body.appendChild(frame);

      function report(state) {
        if (window.parent !== window) {
          const message = { type: 'salon-youtube-preview', state };
          if (state === 'playing') {
            message.title = videos[index].title;
            message.muted = player.isMuted();
          }
          window.parent.postMessage(message, '*');
        }
      }

      function play() {
        if (!player || !requested || document.hidden || innerWidth < 200 || innerHeight < 200) return;
        player.mute();
        player.playVideo();
      }

      function playNext() {
        index = (index + 1) % videos.length;
        player.mute();
        player.loadVideoById({ videoId: videos[index].id, endSeconds: previewSeconds });
      }

      window.addEventListener('message', event => {
        if (event.source !== window.parent || !['file://', 'null'].includes(event.origin) ||
            !event.data || event.data.type !== 'salon-youtube-preview-control') return;
        if (event.data.action === 'play' && !requested) {
          requested = true;
          failedVideos = 0;
          play();
        } else if (event.data.action === 'pause') {
          requested = false;
          if (player) player.pauseVideo();
        }
      });

      document.addEventListener('visibilitychange', () => {
        if (document.hidden && player) player.pauseVideo();
        else play();
      });

      window.onYouTubeIframeAPIReady = () => {
        new YT.Player(frame.id, { events: {
          onReady(event) {
            player = event.target;
            player.mute();
            report('ready');
            play();
          },
          onStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
              if (!requested || document.hidden) {
                event.target.pauseVideo();
                return;
              }
              failedVideos = 0;
              report('playing');
            } else if (requested && event.data === YT.PlayerState.BUFFERING) {
              report('buffering');
            } else if (requested && !document.hidden && event.data === YT.PlayerState.ENDED) {
              playNext();
            }
          },
          onAutoplayBlocked() {
            if (requested) report('blocked');
          },
          onError(event) {
            failedVideos++;
            if (requested && !document.hidden && [100, 101, 150].includes(event.data) &&
                failedVideos < videos.length && player) {
              playNext();
            } else {
              report('error');
            }
          }
        } });
      };

      const script = document.createElement('script');
      script.src = 'https://www.youtube.com/iframe_api';
      script.onerror = () => report('error');
      document.head.appendChild(script);
    }());
  </script>
</body>
</html>
